<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      One word, because a tab is about fifteen characters wide.

      This was "RelicForge · Your weapon is made from how you fight", which is a
      good line that has never been visible: a tab renders it as "RelicForge · Y…"
      and a bookmark is not much kinder. The line was doing its work in the one
      field that cannot display it.

      So the name holds the tab, and the sentence moves to the description below,
      which is what actually unfurls when the link is pasted anywhere.
    -->
    <title>RelicForge</title>

    <!--
      An inscriptional R, in the tradition Cinzel is cut from.

      SVG rather than a bitmap, so one file covers the tab, the bookmark bar and
      a retina pin without three exports that drift apart. The theme colour is
      the arena's own background, so the browser chrome on mobile stops being a
      white bar over a near-black game.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0908" />

    <!--
      The line the title cannot hold, in the field that can.

      Written the way it is said to a player, not the way it is built: nothing
      here about telemetry, compiling or runtime generation. What a person needs
      to know before clicking is that the weapon comes out of the fight.
    -->
    <meta
      name="description"
      content="Beat the boss and your weapon is built from the way you fought. Nobody else gets it."
    />

    <!--
      Cinzel was declared as the display face from the first commit and never
      loaded, so every heading in the game has been rendering as Georgia. It is
      an inscriptional Roman face, cut for stone and metal, which is why it was
      chosen for a game about forging.

      JetBrains Mono carries the telemetry. The pairing is the idea: one face
      names the artifact, the other records it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
