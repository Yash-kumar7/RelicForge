<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RelicForge · Kill it your way. Keep what that makes.</title>

    <!--
      Cinzel was declared as the display face from the first commit and never
      loaded, so every heading in the game has been rendering as Georgia. It is
      an inscriptional Roman face, cut for stone and metal, which is why it was
      chosen for a game about forging.

      JetBrains Mono carries the telemetry. The pairing is the idea: one face
      names the artifact, the other records it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
